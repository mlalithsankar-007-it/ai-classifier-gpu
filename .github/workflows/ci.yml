name: Build and Push Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ocp-ai-runner

    env:
      NEXUS_REGISTRY: 192.168.1.52:8084
      IMAGE_NAME: ai-classifier-gpu

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Nexus
        run: |
          echo "${{ secrets.NEXUS_PASSWORD }}" | \
          buildah login "$NEXUS_REGISTRY" \
            --username "${{ secrets.NEXUS_USERNAME }}" \
            --password-stdin

      - name: Build image
        run: |
          buildah bud \
            -t "$NEXUS_REGISTRY/$IMAGE_NAME:${{ github.sha }}" \
            -t "$NEXUS_REGISTRY/$IMAGE_NAME:latest" \
            .

      - name: Push image to Nexus
        run: |
          buildah push \
            "$NEXUS_REGISTRY/$IMAGE_NAME:${{ github.sha }}"

          buildah push \
            "$NEXUS_REGISTRY/$IMAGE_NAME:latest"

      - name: Logout from Nexus
        if: always()
        run: |
          buildah logout "$NEXUS_REGISTRY"
